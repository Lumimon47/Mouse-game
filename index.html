<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Little Mouse — Bucket Game</title><style>
*{box-sizing:border-box}body{margin:0;background:#161616;color:#eee;font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center;padding:18px 10px}.wrap{width:min(100%,650px)}h1{text-align:center;font-size:22px;margin:6px 0 12px}#scene{position:relative;width:100%;height:340px;background:#000;border:2px solid #666;border-radius:12px;overflow:hidden;touch-action:none}#scene svg{width:100%;height:100%;display:block}#hint{position:absolute;left:10px;top:10px;background:#222c;padding:7px 11px;border-radius:8px;font-size:13px}#interact{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);display:none;white-space:nowrap;background:#fff;color:#111}button{border:0;border-radius:12px;font:700 18px system-ui;padding:14px;cursor:pointer;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.controls button{background:#555;color:#fff;font-size:30px;height:75px;user-select:none}#back{display:none;width:100%;margin-top:10px;background:#444;color:white}p{text-align:center;color:#aaa;font-size:13px}#meter{display:none;margin:12px 0 0;background:#333;border-radius:10px;height:18px;overflow:hidden}#progress{width:0;height:100%;background:#4cc9ff;transition:width .08s}#percent{text-align:center;margin-top:6px;font-size:14px;display:none}
</style></head><body><main class="wrap"><h1>Little Mouse</h1><div id="scene"><svg id="art" viewBox="0 0 600 340" preserveAspectRatio="none" aria-label="Mouse and bucket game">
<rect width="600" height="340" fill="black"/><g id="floor"><rect y="277" width="600" height="63" fill="#777"/><rect y="277" width="600" height="3" fill="#aaa"/></g>
<g id="roomBucket" transform="translate(445 278)"><path d="M-25 -43 L-20 0 Q0 9 20 0 L25 -43Z" fill="#4d5661" stroke="#bbc5ce" stroke-width="3"/><ellipse cy="-43" rx="25" ry="7" fill="#252b33" stroke="#ccd3db" stroke-width="3"/><path d="M-20 -44 Q-24 -78 0 -80 Q24 -78 20 -44" fill="none" stroke="#aab3bc" stroke-width="3"/></g>
<g id="mouse" transform="translate(130 278)"><g id="mouseFacing"><path d="M23 -17 Q67 -39 60 -64 Q57 -80 73 -77" fill="none" stroke="#aaa" stroke-width="5" stroke-linecap="round"/><ellipse cx="12" cy="-18" rx="31" ry="19" fill="#909090" stroke="#555" stroke-width="2"/><ellipse cx="-17" cy="-25" rx="23" ry="23" fill="#aaa" stroke="#555" stroke-width="2"/><ellipse cx="-31" cy="-52" rx="13" ry="17" fill="#aaa" stroke="#555" stroke-width="2"/><ellipse cx="-31" cy="-52" rx="8" ry="11" fill="#e4a5b0"/><ellipse cx="-8" cy="-55" rx="13" ry="17" fill="#aaa" stroke="#555" stroke-width="2"/><ellipse cx="-8" cy="-55" rx="8" ry="11" fill="#e4a5b0"/><circle cx="-25" cy="-30" r="4" fill="#111"/><circle cx="-26" cy="-31" r="1.4" fill="white"/><circle cx="-39" cy="-19" r="5" fill="#f0a6b5"/><path d="M-39 -19 L-58 -25 M-39 -17 L-59 -17 M-39 -15 L-57 -9" stroke="#ddd" stroke-width="1.5"/><ellipse cx="-2" cy="-2" rx="12" ry="5" fill="#e4a5b0"/><ellipse cx="27" cy="-2" rx="12" ry="5" fill="#e4a5b0"/></g></g>
<g id="minigame" display="none"><rect y="297" width="600" height="43" fill="#777"/><rect x="282" width="36" height="18" fill="#8a949e"/><rect x="272" y="14" width="56" height="11" rx="3" fill="#626c77"/><g id="stream"></g><g id="catchBucket" transform="translate(300 297)"><path d="M-37 -65 L-29 0 Q0 12 29 0 L37 -65Z" fill="#4e5662" stroke="#bac3ce" stroke-width="4"/><path id="waterFill" d="" fill="#45c4fa" opacity=".85"/><ellipse cy="-65" rx="37" ry="9" fill="#242a33" stroke="#c9d2db" stroke-width="4"/><ellipse id="waterTop" cy="-65" rx="0" ry="0" fill="#45c4fa"/><g id="greenBits" fill="#8ae85c"><circle cx="-10" cy="-25" r="3"/><circle cx="12" cy="-15" r="2.5"/><circle cx="2" cy="-36" r="2"/></g></g></g></svg><div id="hint">Walk to the bucket →</div><button id="interact">Fill bucket</button></div><div id="meter"><div id="progress"></div></div><div id="percent">0% full</div><div class="controls"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div><button id="back">← Back to room</button><p>Catch the moving blue water and green drops! Tap or hold an arrow to move.</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),mouse=$('mouse'),face=$('mouseFacing'),roomBucket=$('roomBucket'),mini=$('minigame'),hint=$('hint'),interact=$('interact'),back=$('back'),meter=$('meter'),progress=$('progress'),percent=$('percent'),catchBucket=$('catchBucket'),stream=$('stream'),waterFill=$('waterFill'),waterTop=$('waterTop'),greenBits=$('greenBits');let mode='room',mx=130,bx=300,dir=0,fill=0,last=0,spawn=0,drops=[],finished=false,elapsed=0;const ns='http://www.w3.org/2000/svg';function resetDrops(){drops.forEach(d=>d.el.remove());drops=[]}function enter(){mode='fill';dir=0;fill=0;bx=300;finished=false;spawn=0;elapsed=0;resetDrops();mouse.setAttribute('display','none');roomBucket.setAttribute('display','none');mini.setAttribute('display','');interact.style.display='none';back.style.display='block';meter.style.display='block';percent.style.display='block';hint.textContent='Follow the moving water!';updateFill()}function leave(){mode='room';dir=0;resetDrops();mouse.setAttribute('display','');roomBucket.setAttribute('display','');mini.setAttribute('display','none');back.style.display='none';meter.style.display='none';percent.style.display='none';hint.textContent='Walk to the bucket →'}function updateFill(){let p=Math.round(fill*100);progress.style.width=p+'%';percent.textContent=p+'% full';let top=-4-fill*54;waterFill.setAttribute('d',`M ${-29-fill*6} ${top} L ${29+fill*6} ${top} L29 0 Q0 10 -29 0Z`);waterTop.setAttribute('cy',top);waterTop.setAttribute('rx',29+fill*6);waterTop.setAttribute('ry',fill?5:0);greenBits.setAttribute('opacity',fill>.3?'0.9':'0')}function frame(t){let dt=Math.min((t-last||16)/1000,.05);last=t;if(mode==='room'){mx=Math.max(65,Math.min(535,mx+dir*205*dt));mouse.setAttribute('transform',`translate(${mx} 278)`);if(dir)face.setAttribute('transform',dir===1?'scale(-1 1)':'');let near=Math.abs(mx-445)<82;interact.style.display=near?'block':'none';hint.textContent=near?'Bucket nearby — tap Fill bucket':'Walk to the bucket →'}else{elapsed+=dt;bx=Math.max(45,Math.min(555,bx+dir*285*dt));catchBucket.setAttribute('transform',`translate(${bx} 297)`);if(!finished){spawn+=dt;while(spawn>.045){spawn-=.045;let x=300+Math.sin(elapsed*1.25)*175+(Math.random()-.5)*24,green=Math.random()<.23,el=document.createElementNS(ns,'line');el.setAttribute('stroke',green?'#78ed63':'#56caff');el.setAttribute('stroke-width',green?'6':'4');el.setAttribute('stroke-linecap','round');stream.appendChild(el);drops.push({x,y:26,v:240+Math.random()*90,green,el})}}for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=d.v*dt;d.x+=Math.sin(elapsed*1.25)*dt*22;d.el.setAttribute('x1',d.x);d.el.setAttribute('x2',d.x);d.el.setAttribute('y1',d.y);d.el.setAttribute('y2',d.y+(d.green?9:17));if(d.y>=230){if(Math.abs(d.x-bx)<34&&!finished){fill=Math.min(1,fill+(d.green?.006:.008));updateFill()}d.el.remove();drops.splice(i,1)}}if(fill>=1&&!finished){finished=true;hint.textContent='Bucket full! Great job!';resetDrops()}}requestAnimationFrame(frame)}requestAnimationFrame(frame);interact.addEventListener('click',enter);back.addEventListener('click',leave);function bind(id,d){const b=$(id);let held=false;function start(e){if(e.cancelable)e.preventDefault();held=true;dir=d;if(mode==='room'){mx=Math.max(65,Math.min(535,mx+d*12));mouse.setAttribute('transform',`translate(${mx} 278)`)}else{bx=Math.max(45,Math.min(555,bx+d*12));catchBucket.setAttribute('transform',`translate(${bx} 297)`)}}function stop(e){if(held){held=false;if(dir===d)dir=0}}b.addEventListener('touchstart',start,{passive:false});b.addEventListener('touchend',stop);b.addEventListener('touchcancel',stop);b.addEventListener('mousedown',start);window.addEventListener('mouseup',stop);b.addEventListener('click',()=>{if(held)return;if(mode==='room'){mx=Math.max(65,Math.min(535,mx+d*25));mouse.setAttribute('transform',`translate(${mx} 278)`)}else{bx=Math.max(45,Math.min(555,bx+d*25));catchBucket.setAttribute('transform',`translate(${bx} 297)`)}})}bind('left',-1);bind('right',1);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();dir=e.key==='ArrowLeft'?-1:1}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'&&dir===-1||e.key==='ArrowRight'&&dir===1)dir=0});window.addEventListener('blur',()=>dir=0)})();
</script></body></html>
